name: Release

# Auto-release on a version bump. When a push to `main` changes package.json,
# a release tag (`v*`) is pushed, or workflow_dispatch is triggered, this
# builds installers for Windows, macOS and Linux, uploads them to a DRAFT
# GitHub Release, and — only once ALL three platforms succeed — flips the
# release to published so the auto-updater and users can download it.

on:
  push:
    branches: [main]
    paths: ['package.json']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      force:
        description: 'Force release even if already published'
        type: boolean
        default: false
      draft:
        description: 'Keep release as draft'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Release only when package.json's version has no PUBLISHED release yet, so a
  # re-merge that doesn't bump the version is a no-op (and a stuck draft from a
  # failed run self-heals on the next push).
  guard:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      is_draft: ${{ steps.check.outputs.is_draft }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          FORCE: ${{ inputs.force }}
          DRAFT_ONLY: ${{ inputs.draft }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_draft=${DRAFT_ONLY:-false}" >> "$GITHUB_OUTPUT"

          if [ "$FORCE" = "true" ]; then
            echo "Force release requested for v$VERSION."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh release view "v$VERSION" --repo "$GH_REPO" --json isDraft --jq '.isDraft' 2>/dev/null | grep -q '^false$'; then
            echo "v$VERSION is already published in $GH_REPO — nothing to do."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$VERSION for $GH_REPO."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  # Build + upload each OS's installers to the (draft) release for this version.
  build:
    needs: guard
    if: needs.guard.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        # windows-2022 ships Visual Studio 2022, which node-gyp detects reliably
        # (the newest windows-latest image has a VS that older node-gyp can't
        # parse). Pin macOS too: the macos-latest update to 26.6.2 broke
        # electron-builder 25's temporary signing keychain (SecKeychainUnlock).
        # macos-15 keeps the same arm64 artifacts; CI still tests macos-latest.
        os: [windows-2022, macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # --ignore-scripts skips native postinstall builds (better-sqlite3 tries
        # to compile for Node here and fails: npm's bundled node-gyp can't detect
        # the runner's newest Visual Studio). We don't need a Node-ABI binary —
        # electron-builder rebuilds native deps against Electron's ABI when it
        # packages (npmRebuild: true), preferring prebuilt binaries.
        run: npm ci --ignore-scripts

      - name: Build renderer + main
        run: npm run build

      - name: Verify macOS signing secrets
        # Fail fast (in ~1s) with a clear message if the mac signing/notarization
        # secrets are misconfigured, instead of dying 60s deep in electron-builder
        # with a cryptic "APPLE_* env var needs to be set". All five must be set
        # together (or none, for unsigned fork builds); a partial set is the usual
        # mistake — e.g. `gh secret set X` that stored an empty value.
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -z "${!v}" ] && missing+=("$v")
          done
          if [ "${#missing[@]}" -eq 5 ]; then
            echo "::notice::No macOS signing secrets set — building UNSIGNED (ok for forks/PRs)."
            exit 0
          fi
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::macOS signing/notarization is partially configured. Empty/missing secret(s): ${missing[*]}"
            echo "Re-set each blank secret (they are write-only, so an empty 'gh secret set' looks 'set' but isn't):"
            for v in "${missing[@]}"; do
              case "$v" in
                CSC_LINK)            echo "    gh secret set MAC_CSC_LINK          # base64 of the Developer ID .p12";;
                CSC_KEY_PASSWORD)    echo "    gh secret set MAC_CSC_KEY_PASSWORD  # the .p12 export password";;
                *)                   echo "    gh secret set $v";;
              esac
            done
            echo "Or run the helper:  bash script/setup-mac-ci-secrets.sh   (see SIGNING.md)"
            exit 1
          fi
          echo "✓ All 5 macOS signing/notarization secrets are present."

      - name: Package & upload to the draft release
        run: npx --no-install electron-builder --publish always
        env:
          # Provided automatically by Actions; lets electron-builder upload assets.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

          # ----- macOS signing + notarization (Apple Developer ID) -----
          # Scoped to the macOS runner on purpose: CSC_LINK is ALSO the Windows
          # signing variable, so exposing the mac .p12 to the Windows job would
          # make it try to sign the .exe with a mac cert and fail. The APPLE_*
          # trio drives notarytool (all three must be set together or the mac
          # build errors; if none are set, notarization is skipped with a warning).
          # Set these once via `bash script/setup-mac-ci-secrets.sh` — see SIGNING.md.
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}

          # ----- Windows code signing (Azure Artifact Signing) — TODO -----
          # AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          # AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          # AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

  # Every platform uploaded successfully → make the release live (creates the
  # vX.Y.Z tag and lets the auto-updater pick it up). If any build failed, the
  # release stays a draft so a half-finished version never ships.
  publish:
    needs: [guard, build]
    if: needs.guard.outputs.should_release == 'true' && needs.guard.outputs.is_draft != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "v${{ needs.guard.outputs.version }}" --repo "$GH_REPO" --draft=false --latest
