name: Release

# Auto-release on a version bump. When a push to `main` changes package.json,
# a release tag (`v*`) is pushed, or workflow_dispatch is triggered, this
# builds installers for Windows, macOS and Linux, uploads them to a DRAFT
# GitHub Release, and — once builds succeed — flips the release to published
# so users and the auto-updater can download it.

on:
  push:
    branches: [main]
    paths: ['package.json']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platforms to build (all, windows, macos, linux)'
        required: false
        default: 'windows'
        type: choice
        options:
          - all
          - windows
          - macos
          - linux
      force:
        description: 'Force release even if already published'
        type: boolean
        default: false
      draft:
        description: 'Keep release as draft'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Release only when package.json's version has no PUBLISHED release yet, so a
  # re-merge that doesn't bump the version is a no-op (and a stuck draft from a
  # failed run self-heals on the next push).
  guard:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      is_draft: ${{ steps.check.outputs.is_draft }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          FORCE: ${{ inputs.force }}
          DRAFT_ONLY: ${{ inputs.draft }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_draft=${DRAFT_ONLY:-false}" >> "$GITHUB_OUTPUT"

          if [ "$FORCE" = "true" ]; then
            echo "Force release requested for v$VERSION."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh release view "v$VERSION" --repo "$GH_REPO" --json isDraft --jq '.isDraft' 2>/dev/null | grep -q '^false$'; then
            echo "v$VERSION is already published in $GH_REPO — nothing to do."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$VERSION for $GH_REPO."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  # Build + upload each OS's installers to the (draft) release for this version.
  build:
    needs: guard
    if: |
      needs.guard.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        # windows-2022 ships Visual Studio 2022, which node-gyp detects reliably
        # (the newest windows-latest image has a VS that older node-gyp can't
        # parse). Pin macOS too: the macos-latest update to 26.6.2 broke
        # electron-builder 25's temporary signing keychain (SecKeychainUnlock).
        # macos-15 keeps the same arm64 artifacts; CI still tests macos-latest.
        os: [windows-2022, macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check platform filter
        id: filter
        shell: bash
        run: |
          TARGET="${{ inputs.platform }}"
          RUNNER_OS="${{ matrix.os }}"
          if [ -z "$TARGET" ] || [ "$TARGET" = "all" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$TARGET" = "windows" ] && [ "$RUNNER_OS" = "windows-2022" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$TARGET" = "macos" ] && [ "$RUNNER_OS" = "macos-15" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$TARGET" = "linux" ] && [ "$RUNNER_OS" = "ubuntu-latest" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.filter.outputs.run == 'true'
        with:
          lfs: true

      - uses: actions/setup-node@v4
        if: steps.filter.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.filter.outputs.run == 'true'
        # --ignore-scripts skips native postinstall builds (better-sqlite3 tries
        # to compile for Node here and fails: npm's bundled node-gyp can't detect
        # the runner's newest Visual Studio). We don't need a Node-ABI binary —
        # electron-builder rebuilds native deps against Electron's ABI when it
        # packages (npmRebuild: true), preferring prebuilt binaries.
        run: npm ci --ignore-scripts

      - name: Build renderer + main
        if: steps.filter.outputs.run == 'true'
        run: npm run build

      - name: Verify macOS signing secrets
        if: steps.filter.outputs.run == 'true' && runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -z "${!v}" ] && missing+=("$v")
          done
          if [ "${#missing[@]}" -eq 5 ]; then
            echo "::notice::No macOS signing secrets set — building UNSIGNED."
            exit 0
          fi
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::warning::macOS signing/notarization is partially configured. Building unsigned."
            exit 0
          fi
          echo "✓ All 5 macOS signing/notarization secrets are present."

      - name: Package & upload to the draft release
        if: steps.filter.outputs.run == 'true'
        shell: bash
        run: |
          EXTRA_FLAGS=""
          if [ "$RUNNER_OS" = "macOS" ] && [ -z "$MAC_CSC_LINK" ]; then
            echo "Building unsigned macOS binaries (disabling notarization and signing identity)"
            EXTRA_FLAGS="-c.mac.identity=null -c.mac.notarize=false"
          fi
          npx --no-install electron-builder --publish always $EXTRA_FLAGS
        env:
          # Provided automatically by Actions; lets electron-builder upload assets.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

          # ----- macOS signing + notarization (Apple Developer ID) -----
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

  # Publish the release once build jobs finish. Runs even if a non-fatal runner
  # issue occurred, as long as the run wasn't cancelled.
  publish:
    needs: [guard, build]
    if: |
      always() &&
      needs.guard.outputs.should_release == 'true' &&
      needs.guard.outputs.is_draft != 'true' &&
      needs.build.result != 'cancelled' &&
      needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="v${{ needs.guard.outputs.version }}"
          echo "Publishing release $VERSION in $GH_REPO..."
          if gh release view "$VERSION" --repo "$GH_REPO" 2>/dev/null; then
            gh release edit "$VERSION" --repo "$GH_REPO" --draft=false --latest
            echo "✓ Release $VERSION published successfully."
          else
            echo "Release $VERSION not found by exact tag. Checking draft releases in $GH_REPO..."
            DRAFT_TAG=$(gh release list --repo "$GH_REPO" --json tagName,isDraft --jq '.[] | select(.isDraft == true) | .tagName' | head -n 1)
            if [ -n "$DRAFT_TAG" ]; then
              echo "Publishing draft release $DRAFT_TAG..."
              gh release edit "$DRAFT_TAG" --repo "$GH_REPO" --draft=false --latest
              echo "✓ Draft release $DRAFT_TAG published successfully."
            else
              echo "::error::No draft release found to publish in $GH_REPO."
              exit 1
            fi
          fi
